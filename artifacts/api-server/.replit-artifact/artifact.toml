kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["uv", "sync", "--project", ".", "--no-dev", "--frozen"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["uv", "run", "--project", ".", "uvicorn", "main:app", "--app-dir", "artifacts/api-server/src", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/api/healthz"
